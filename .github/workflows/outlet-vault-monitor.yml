name: Outlet Vault Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run live Outlet Vault monitor
        env:
          OUTLET_VAULT_ADMIN_TOKEN: ${{ secrets.OUTLET_VAULT_ADMIN_TOKEN }}
        run: |
          test -n "$OUTLET_VAULT_ADMIN_TOKEN" || { echo "Missing OUTLET_VAULT_ADMIN_TOKEN"; exit 1; }
          curl --fail-with-body --retry 2 --max-time 300 \
            -X POST "https://outlet-vault-api.onrender.com/api/monitor/run" \
            -H "Authorization: Bearer $OUTLET_VAULT_ADMIN_TOKEN" \
            -H "Content-Type: application/json"
