name: Outlet Vault Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/outlet-vault
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Outlet Vault monitor
        working-directory: outlet-vault-worker
        run: npm run monitor
